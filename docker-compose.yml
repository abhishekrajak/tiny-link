version: '3.8'  # Always specify version

services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tiny-link
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped  # Recommended for production

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistent storage
    ports:
      - "5432:5432"  # Optional: Only needed if you want external access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d tiny-link"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:  # Declare volume for persistence