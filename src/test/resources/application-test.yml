API_BASE_URL: http://localhost:8080

spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - email
              - profile
              - openid
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: testSecretKeyForTestingOnly1234567890
  expiration: 3600000
  issuer: ${API_BASE_URL}

app:
  config:
    redirect-url: http://localhost:3000
    tiny-url-code-length: 7
    tiny-url-code-min-length: 7
    tiny-url-code-max-length: 20
    tiny-link-allowed-chars: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789
    short-code-generation-max-retry-count: 5
    base-url: http://localhost:3000
    base-user-max-links: 50
    special-user-max-links: 100
    corporate-user-max-links: 1000
    api-base-url: ${API_BASE_URL}
  rate-limiting:
    default-value:
      capacity: 30
      durationMinutes: 60
    tiers:
      BASE:
        createTinyLink: 10
        updateTinyLink: 20
        deactivateTinyLink: 10
        deleteTinyLink: 50
        analyticsDashboard: 50
      SPECIAL:
        createTinyLink: 10
        updateTinyLink: 20
        deactivateTinyLink: 10
        deleteTinyLink: 50
        analyticsDashboard: 15
      CORPORATE:
        createTinyLink: 10
        updateTinyLink: 20
        deactivateTinyLink: 10
        deleteTinyLink: 50
        analyticsDashboard: 5